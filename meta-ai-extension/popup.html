<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta.ai Bulk Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎨 Meta.ai Bulk Generator</h1>
      <p class="subtitle">Geração e download automático em massa</p>
    </header>

    <div class="status-bar" id="statusBar">
      <span class="status-icon">⏸️</span>
      <span class="status-text" id="statusText">Pronto para iniciar</span>
    </div>

    <section class="prompts-section">
      <div class="section-header">
        <h2>Lista de Prompts</h2>
        <span class="counter" id="promptCounter">0 prompts</span>
      </div>

      <textarea
        id="promptsInput"
        placeholder="Cole seus prompts aqui (um por linha)&#10;&#10;Exemplo:&#10;A beautiful sunset over the ocean&#10;A futuristic city with flying cars&#10;A cute cat playing with yarn"
        rows="10"
      ></textarea>

      <div class="button-group">
        <button id="loadPrompts" class="btn btn-secondary">
          📋 Carregar Lista
        </button>
        <button id="clearPrompts" class="btn btn-secondary">
          🗑️ Limpar
        </button>
      </div>
    </section>

    <section class="prompts-list" id="promptsList">
      <!-- Prompts will be added here dynamically -->
    </section>

    <section class="controls-section">
      <div class="settings">
        <label class="checkbox-label">
          <input type="checkbox" id="autoDownload" checked>
          <span>Download automático das imagens</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="autoNext" checked>
          <span>Iniciar próximo prompt automaticamente</span>
        </label>
        <div class="delay-setting">
          <label for="delayInput">Delay entre prompts:</label>
          <input type="number" id="delayInput" value="5" min="3" max="30" step="1">
          <span>segundos</span>
        </div>
      </div>

      <div class="action-buttons">
        <button id="startBtn" class="btn btn-primary">
          ▶️ Iniciar Geração
        </button>
        <button id="pauseBtn" class="btn btn-warning" disabled>
          ⏸️ Pausar
        </button>
        <button id="stopBtn" class="btn btn-danger" disabled>
          ⏹️ Parar
        </button>
      </div>
    </section>

    <section class="progress-section">
      <div class="progress-header">
        <span>Progresso</span>
        <span id="progressText">0/0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">✅ Concluídos:</span>
          <span class="stat-value" id="completedCount">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">📥 Downloads:</span>
          <span class="stat-value" id="downloadCount">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">❌ Erros:</span>
          <span class="stat-value" id="errorCount">0</span>
        </div>
      </div>
    </section>

    <footer>
      <p>⚠️ Mantenha a aba do Meta.ai aberta durante o processo</p>
    </footer>
  </div>

  <script src="scripts/popup.js"></script>
</body>
</html>
