services:
  - type: web
    name: quizflow-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build --workspace=packages/shared
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
